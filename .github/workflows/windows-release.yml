name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds
  cancel-in-progress: false

jobs:
  build-version:
    if: github.repository == 'WeslyG/LinkUnbound'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine version and validate the changelog
        id: version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = [regex]::Match((Get-Content -Raw Cargo.toml), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Expected a stable tag such as v2.1.1'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          node .github/scripts/release-notes.cjs $version "$env:RUNNER_TEMP/release-notes.md"
          "version=$version" >> $env:GITHUB_OUTPUT

  windows:
    needs: build-version
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/prepare
        with:
          version: ${{ needs.build-version.outputs.version }}
          targets: x86_64-pc-windows-msvc
      - name: Test core
        run: cargo test --locked -p linkunbound-core
      - name: Test interface
        working-directory: app
        run: |
          npm ci
          npm exec -- vitest run
      - name: Build the browser picker
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --release --bin linkunbound-shell
          New-Item -ItemType Directory -Path app/src-tauri/binaries -Force | Out-Null
          Copy-Item target/release/linkunbound-shell.exe app/src-tauri/binaries/linkunbound-shell-x86_64-pc-windows-msvc.exe
      - name: Bundle Windows x64
        working-directory: app
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/LinkUnbound_${{ needs.build-version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 7


  macos:
    needs: build-version
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      VERSION: ${{ needs.build-version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch }}-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/prepare
        with:
          version: ${{ env.VERSION }}
          targets: ${{ env.TARGET }}
      - name: Set the deployment target
        run: |
          floor=$(node -p 'require("./app/src-tauri/tauri.conf.json").bundle.macOS.minimumSystemVersion')
          echo "MACOSX_DEPLOYMENT_TARGET=$floor" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - uses: ./.github/actions/sidecar
        with:
          profile: release
          target: ${{ env.TARGET }}
      - name: Build the app
        working-directory: app
        run: npm run tauri -- build --target "$TARGET" --no-bundle
      - name: Bundle the app and disk image
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$APPLE_SIGNING_IDENTITY" = '-' ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          elif [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Apple Developer ID and notarization credentials must be configured together"
            exit 1
          fi
          settings="target/$TARGET/release/linkunbound-settings"
          if [ "$APPLE_SIGNING_IDENTITY" = '-' ]; then
            codesign --force --sign - "../$settings"
          else
            signing_dir=$(mktemp -d)
            keychain="$signing_dir/build.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            trap 'security delete-keychain "$keychain" || true; rm -f "$signing_dir/certificate.p12"; rmdir "$signing_dir"' EXIT
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$signing_dir/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$signing_dir/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$keychain" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "../$settings"
          fi
          codesign --verify --strict "../$settings"
          npm run tauri -- bundle --target "$TARGET" --bundles app,dmg
      - name: Verify and stage macOS artifacts
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          app="$bundle/macos/LinkUnbound.app"
          plist="$app/Contents/Info.plist"
          chip="$ARCH"
          if [ "$ARCH" = aarch64 ]; then chip=arm64; fi
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$VERSION"
          test "$(plutil -extract CFBundleExecutable raw -o - "$plist")" = linkunbound-shell
          for bin in linkunbound-shell linkunbound-settings; do
            test "$(lipo -archs "$app/Contents/MacOS/$bin")" = "$chip"
          done
          codesign --verify --deep --strict "$app"
          mkdir -p release-assets
          images=("$bundle"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          cp "${images[0]}" "release-assets/LinkUnbound_${VERSION}_macOS_$ARCH.dmg"
          if xcrun stapler validate "$app"; then
            tar -czf "release-assets/LinkUnbound_${VERSION}_macOS_$ARCH.app.tar.gz" \
              -C "$bundle/macos" LinkUnbound.app
          else
            echo "::notice::macOS disk image is available. The updater archive requires Apple notarization."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  sign:
    needs: [build-version, windows, macos]
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-nsis
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Sign and verify the release artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Tauri signing secrets are missing'
          }
          $files = @(Get-ChildItem release-assets -File)
          foreach ($file in $files) {
            node app/node_modules/@tauri-apps/cli/tauri.js signer sign --app-version $env:VERSION $file.FullName
            node .github/scripts/verify-updater.cjs $file.FullName $env:VERSION
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [build-version, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: release-assets
      - name: Publish the release and update the stable manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-version.outputs.version }}
        run: ./.github/scripts/publish-release.ps1
