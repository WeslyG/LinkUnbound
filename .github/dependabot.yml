version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: scope

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    multi-ecosystem-group: monthly-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: monthly-dependencies
    patterns: ["*"]
    allow:
      # The inventory workflow resolves compatible transitive updates in one Cargo run.
      - dependency-type: direct
    cooldown:
      default-days: 7
    # Tauri, Slint and tray-icon must share a single muda on macOS. Upgrade
    # them together when they use the same version of muda again.
    # windows-future moves with windows because the Store API shares its types.
    ignore:
      - dependency-name: muda
      - dependency-name: tray-icon
      - dependency-name: windows-future
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "slint*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "tauri*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: npm
    directories:
      - /
      - /app
    multi-ecosystem-group: monthly-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    # Move the picker API and CLI with the Rust Tauri stack.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
