[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
exclude = ["vendor"]

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
linkunbound-core = { path = "crates/linkunbound-core" }
linkunbound-mac = { path = "crates/linkunbound-mac" }
linkunbound-win = { path = "crates/linkunbound-win" }
linkunbound-shell = { path = "crates/linkunbound-shell" }
slint = { version = "~1.18.1", default-features = false, features = [
  "compat-1-2",
  "backend-winit",
  "raw-window-handle-06",
  "renderer-software",
  "std",
  "unstable-winit-030",
] }
slint-build = "~1.18.1"
tray-icon = "0.24"
global-hotkey = "0.9"
muda = "0.19"
interprocess = "2.4"
# No tray feature: the resident owns the tray, through the `tray-icon` crate.
# `common-controls-v6` is a default feature, and Cargo unifies features across
# the workspace: it put a TaskDialogIndirect import into the resident, whose
# test binaries carry no manifest to satisfy it.
# Tauri 2.11, Slint 1.18 and tray-icon 0.24 share muda 0.19.
# Tauri 2.12 uses muda 0.20 and Slint 1.19 uses 0.21. A mixed stack breaks macOS linking.
tauri = { version = "~2.11", default-features = false, features = ["wry", "compression"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Without `zip`: the updater only unzips v1-style Windows bundles, and ours ship the bare installer.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
  "charset",
  "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.9"
percent-encoding = "2"
png = "0.18"
base64 = "0.23"
thiserror = "2"

[profile.release]
# The resident is mapped for the whole session, so its size is working set the
# user pays for all day. Panics still unwind: aborting would turn a recoverable
# failure into a crash with no notice.
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[patch.crates-io]
# macOS drops the alpha of every pixel without it; vendor/README.md says why and when it goes.
softbuffer = { path = "vendor/softbuffer" }
